# PostgreSQL + pgvector para el backend real (NestJS + Prisma).
# Requiere Docker Desktop iniciado. Levantar con:  docker compose up -d
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: asistencia-db
    environment:
      POSTGRES_USER: asistencia
      POSTGRES_PASSWORD: asistencia
      POSTGRES_DB: asistencia
    ports:
      - "5432:5432"
    volumes:
      - asistencia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asistencia"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  asistencia_pgdata:
